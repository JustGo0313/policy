<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加我一起寫同學錄 · Gradbook</title>
<!--
  同學把好友碼貼進班級群組時，附的就是這個網址。

  🔴 **這個網址要穩定。** App 內的 `friendCodeShareText` 六個語系都寫死它，
  而那些訊息已經躺在別人的聊天室裡了——改網址等於讓那些連結全部失效。

  🔴 **不要在這裡寫會過期的話**（「即將上架」「敬請期待」）。
  頁面沒有人會回來更新，而過期的那一句會一直掛在那裡。

  ⬜ **上架那天要做的事**（只有這一處）：
     把下面 `<!-- STORE_LINKS -->` 那一段換成真的商店連結。
     在那之前那一段是空的——寧可少一段，也不要放一個按了會 404 的按鈕。
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 2rem 1.25rem;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    max-width: 32rem; margin-inline: auto;
  }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p  { margin: .6rem 0; }
  .muted { opacity: .7; font-size: .92rem; }
  .code {
    margin: 1.5rem 0; padding: 1.1rem 1rem; border-radius: .75rem;
    border: 1px solid rgba(128,128,128,.35);
    text-align: center;
  }
  #code {
    font: 700 2rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .18em; word-break: break-all;
  }
  button {
    margin-top: .9rem; padding: .6rem 1.2rem; font-size: 1rem;
    border-radius: .6rem; border: 1px solid rgba(128,128,128,.5);
    background: transparent; color: inherit; cursor: pointer;
  }
  ol { padding-inline-start: 1.3rem; }
</style>
</head>
<body>
  <h1>有同學想請你在他的紀念冊上寫一頁</h1>
  <p>Gradbook 是把紙本同學錄搬到手機上的 App。<strong>填別人的頁永遠免費</strong>，
     你寫完的那一頁會留在對方的本子裡。</p>

  <div class="code">
    <div class="muted">他的好友碼</div>
    <div id="code">—</div>
    <button id="copy" hidden>複製</button>
  </div>

  <ol id="how" hidden>
    <li>打開 Gradbook</li>
    <li>點下面那排的〔我的同學〕</li>
    <li>右下角〔輸入好友碼〕</li>
    <li>把上面那組碼貼進去</li>
  </ol>

  <p class="muted" id="nocode" hidden>
    這個連結裡沒有帶好友碼——請同學重新用 App 裡的〔分享〕再傳一次。
  </p>

  <!-- STORE_LINKS -->

  <p class="muted"><a href="../gradbook-policy.html">隱私權政策</a></p>

<script>
  // 🔑 只認 `c`，而且**只留 App 也接受的字元**（英數）——
  //    網址參數是外面來的，直接塞進 DOM 會變成注入點。
  var raw = new URLSearchParams(location.search).get('c') || '';
  var code = raw.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 16);
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('how').hidden = false;
    var btn = document.getElementById('copy');
    btn.hidden = false;
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(code).then(function () {
        btn.textContent = '複製好了';
      });
    });
  } else {
    document.getElementById('code').textContent = '—';
    document.getElementById('nocode').hidden = false;
  }
</script>
</body>
</html>
